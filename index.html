<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}

@keyframes slideIn{0%{transform:translate(-50%,-50%) translateX(110vw) rotate(3deg);opacity:0}60%{transform:translate(-50%,-50%) translateX(-10px) rotate(-1deg);opacity:1}80%{transform:translate(-50%,-50%) translateX(5px) rotate(0.5deg)}100%{transform:translate(-50%,-50%) translateX(0) rotate(0deg)}}
@keyframes envShake{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(-50%,-50%) translateY(-6px) rotate(-1.5deg)}40%{transform:translate(-50%,-50%) translateY(-8px) rotate(1.5deg)}60%{transform:translate(-50%,-50%) translateY(-5px) rotate(-1deg)}80%{transform:translate(-50%,-50%) translateY(-3px) rotate(0.8deg)}}
@keyframes lidOpen{0%{transform:rotateX(0deg)}100%{transform:rotateX(-170deg)}}
@keyframes cardRise{0%{transform:translate(-50%,0) scaleX(0.9);opacity:0}50%{opacity:1}100%{transform:translate(-50%,-80%) scaleX(1);opacity:1}}
@keyframes cardReveal{0%{transform:rotateY(90deg) scale(0.85);opacity:0}100%{transform:rotateY(0deg) scale(1);opacity:1}}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
@keyframes flame{0%,100%{transform:scaleY(1) skewX(0deg)}50%{transform:scaleY(1.25) skewX(5deg)}}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes sparkle{0%,100%{opacity:0.25;transform:scale(0.8)}50%{opacity:1;transform:scale(1.3)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes heartFly{0%{transform:translate(-50%,-50%) scale(0.3);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--hx)),calc(-50% + var(--hy))) scale(var(--hs));opacity:0}}

.scene{
  position:relative;
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(ellipse at 50% 40%, #3d1670 0%, #1a0a2e 60%, #0d0518 100%);
  overflow:hidden;
}

.bg-stars{position:absolute;inset:0;pointer-events:none;z-index:0}
.star-dot{position:absolute;border-radius:50%;background:#fff;animation:sparkle ease-in-out infinite}
.confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.confetti-piece{position:absolute;top:-12px;border-radius:2px;animation:fall linear infinite}
.heart-piece{position:absolute;top:50%;left:50%;animation:heartFly cubic-bezier(0.15,0.7,0.4,1) forwards;pointer-events:none}

.env-wrap{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%) translateX(110vw) rotate(3deg);
  opacity:0;
  cursor:pointer;
  perspective:1000px;
  z-index:5;
  transition:none;
}
.env-wrap.slide-in{animation:slideIn 1.1s cubic-bezier(0.34,1.56,0.64,1) forwards}
.env-wrap.shake{animation:envShake 0.7s ease-in-out}

.env-body{
  position:relative;
  background:#c97dd5;
  border-radius:0 0 16px 16px;
  overflow:hidden;
}
.env-left{position:absolute;bottom:0;left:0;width:0;height:0;border-style:solid;border-color:transparent transparent transparent #a855c8}
.env-right{position:absolute;bottom:0;right:0;width:0;height:0;border-style:solid;border-color:transparent #9c47bc transparent transparent}
.env-bottom{position:absolute;bottom:0;left:0;right:0;width:0;height:0;border-style:solid;border-color:transparent transparent #b06abf transparent;margin:auto}
.env-seal{
  position:absolute;left:50%;transform:translateX(-50%);
  background:#e879b5;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2.5px solid #f0a8d0;
  font-size:20px;
  transition:opacity 0.3s;
  z-index:10;
}
.env-lid{
  position:absolute;top:0;left:0;right:0;
  border-style:solid;border-color:#d48ae0 transparent transparent transparent;
  transform-origin:top center;
  z-index:9;
}
.env-lid.opening{animation:lidOpen 0.75s cubic-bezier(0.4,0,0.2,1) forwards}

.card-rising{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,0);
  z-index:6;
  animation:cardRise 1s cubic-bezier(0.34,1.35,0.64,1) forwards;
}
.card-inner{
  border-radius:20px;
  overflow:hidden;
  animation:cardReveal 0.55s ease 0.35s both;
}

.bday-card{
  background:linear-gradient(145deg,#ff9de2 0%,#ffd6f0 50%,#ffb7e4 100%);
  border-radius:20px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.card-circles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.card-circle{position:absolute;border-radius:50%;opacity:0.15}
.card-title{font-weight:500;color:#7a1c5a;animation:bounce 2s ease-in-out infinite;line-height:1.2}
.card-sub{color:#c0397e}
.cakes-row{display:flex;justify-content:center;align-items:flex-end}
.cake-svg{animation:sway 3.2s ease-in-out infinite}
.cake-svg:nth-child(2){animation-delay:-1.3s}
.cake-svg:nth-child(3){animation-delay:-2.1s}
.flame-g{animation:flame 0.52s ease-in-out infinite;transform-origin:50% 100%}
.msg-box{background:rgba(255,255,255,0.62);border-radius:14px;color:#8a1f5c;line-height:1.65;border:1.5px solid rgba(255,160,210,0.45);animation:fadeUp 0.5s ease 0.6s both}
.hearts-row{display:flex;justify-content:center;animation:bounce 1.9s ease-in-out infinite}
.wish-btn{
  background:linear-gradient(135deg,#e8439c,#c0186e);
  color:#fff;border:none;border-radius:50px;
  font-weight:500;cursor:pointer;
  animation:pulse 2s ease-in-out infinite;
  font-family:inherit;
  transition:transform 0.15s;
}
.wish-btn:hover{transform:scale(1.08)!important}

.hint{
  position:absolute;bottom:28px;left:0;right:0;
  text-align:center;color:rgba(255,255,255,0.5);
  font-size:14px;pointer-events:none;
  transition:opacity 0.5s;
  z-index:10;
  font-family:system-ui,sans-serif;
}
.replay-btn{
  position:absolute;top:20px;right:20px;
  background:rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.75);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:20px;padding:8px 18px;
  font-size:13px;cursor:pointer;
  font-family:system-ui,sans-serif;
  transition:background 0.2s;
  z-index:20;
}
.replay-btn:hover{background:rgba(255,255,255,0.22)}

/* ── Responsive sizing ── */
:root{
  --env-w:360px; --env-h:240px; --env-lid-h:128px;
  --env-tri-h:140px;
  --card-w:340px;
  --seal-size:42px; --seal-bottom:90px;
  --cake-gap:14px;
  --card-pad:28px 24px;
  --title-size:26px; --sub-size:14px;
  --msg-size:13px; --msg-pad:16px 18px;
  --heart-size:18px; --heart-gap:10px;
  --btn-pad:12px 28px; --btn-size:14px;
}

@media (max-width:480px){
  :root{
    --env-w:88vw; --env-h:58vw; --env-lid-h:30vw;
    --env-tri-h:34vw;
    --card-w:88vw;
    --seal-size:36px; --seal-bottom:22vw;
    --cake-gap:8px;
    --card-pad:20px 14px;
    --title-size:20px; --sub-size:12px;
    --msg-size:11.5px; --msg-pad:12px 14px;
    --heart-size:15px; --heart-gap:7px;
    --btn-pad:10px 22px; --btn-size:13px;
  }
}

@media (min-width:1200px){
  :root{
    --env-w:440px; --env-h:290px; --env-lid-h:155px;
    --env-tri-h:170px;
    --card-w:420px;
    --seal-size:50px; --seal-bottom:110px;
    --cake-gap:18px;
    --card-pad:36px 30px;
    --title-size:32px; --sub-size:16px;
    --msg-size:15px; --msg-pad:20px 22px;
    --heart-size:22px; --heart-gap:12px;
    --btn-pad:14px 34px; --btn-size:16px;
  }
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="bg-stars" id="bgStars"></div>
  <div class="confetti-layer" id="confettiLayer"></div>
  <div class="confetti-layer" id="heartsLayer"></div>

  <div class="env-wrap" id="envWrap" onclick="handleClick()" aria-label="Birthday envelope, click to open">
    <div class="env-body" id="envBody">
      <div class="env-left" id="envLeft"></div>
      <div class="env-right" id="envRight"></div>
      <div class="env-bottom" id="envBottom"></div>
      <div class="env-seal" id="seal">&#10084;</div>
    </div>
    <div class="env-lid" id="lid"></div>
  </div>

  <div class="hint" id="hint">Click the envelope to open</div>
  <button class="replay-btn" onclick="replay()">Replay</button>
</div>

<script>
const confColors=['#e84393','#ffb7e4','#a78bfa','#fbbf24','#34d399','#60a5fa','#f87171','#fff176','#c084fc','#f9a8d4'];
let phase=0;

function getEnvSize(){
  const vw=window.innerWidth;
  if(vw<=480) return {w:vw*0.88,h:vw*0.58,lid:vw*0.30,tri:vw*0.34,sealB:vw*0.22,sealS:36,cardW:vw*0.88};
  if(vw>=1200) return {w:440,h:290,lid:155,tri:170,sealB:110,sealS:50,cardW:420};
  return {w:360,h:240,lid:128,tri:140,sealB:90,sealS:42,cardW:340};
}

function applyEnvSize(){
  const s=getEnvSize();
  const wrap=document.getElementById('envWrap');
  const body=document.getElementById('envBody');
  const left=document.getElementById('envLeft');
  const right=document.getElementById('envRight');
  const bot=document.getElementById('envBottom');
  const lid=document.getElementById('lid');
  const seal=document.getElementById('seal');
  const hw=Math.round(s.w/2);

  wrap.style.width=s.w+'px';
  wrap.style.height=s.h+'px';
  body.style.width=s.w+'px';
  body.style.height=s.h+'px';
  left.style.cssText=`position:absolute;bottom:0;left:0;width:0;height:0;border-style:solid;border-width:${Math.round(s.h/2)}px 0 ${Math.round(s.h/2)}px ${hw}px;border-color:transparent transparent transparent #a855c8`;
  right.style.cssText=`position:absolute;bottom:0;right:0;width:0;height:0;border-style:solid;border-width:${Math.round(s.h/2)}px ${hw}px ${Math.round(s.h/2)}px 0;border-color:transparent #9c47bc transparent transparent`;
  bot.style.cssText=`position:absolute;bottom:0;left:0;right:0;width:0;height:0;margin:auto;border-style:solid;border-width:0 ${hw}px ${s.tri}px ${hw}px;border-color:transparent transparent #b06abf transparent`;
  lid.style.cssText=`position:absolute;top:0;left:0;right:0;width:0;height:0;margin:auto;border-style:solid;border-width:${s.lid}px ${hw}px 0 ${hw}px;border-color:#d48ae0 transparent transparent transparent;transform-origin:top center;z-index:9`;
  seal.style.cssText=`position:absolute;left:50%;transform:translateX(-50%);bottom:${s.sealB}px;width:${s.sealS}px;height:${s.sealS}px;background:#e879b5;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #f0a8d0;font-size:${Math.round(s.sealS*0.45)}px;transition:opacity 0.3s;z-index:10`;
}

function makeBgStars(){
  const s=document.getElementById('bgStars');
  s.innerHTML='';
  for(let i=0;i<70;i++){
    const d=document.createElement('div');
    d.className='star-dot';
    const sz=1+Math.random()*2.5;
    d.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s;opacity:${0.3+Math.random()*0.7}`;
    s.appendChild(d);
  }
}

function makeConfetti(n){
  const c=document.getElementById('confettiLayer');
  c.innerHTML='';
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    const color=confColors[Math.floor(Math.random()*confColors.length)];
    const sz=6+Math.random()*9;
    el.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${color};transform:rotate(${Math.random()*360}deg);animation-duration:${2.8+Math.random()*3}s;animation-delay:${Math.random()*2.5}s;`;
    c.appendChild(el);
  }
}

function handleClick(){
  if(phase===0){phase=1;document.getElementById('hint').style.opacity='0';openEnv();}
}

function openEnv(){
  const lid=document.getElementById('lid');
  document.getElementById('seal').style.opacity='0';
  lid.classList.add('opening');
  setTimeout(riseCard,750);
}

function riseCard(){
  const scene=document.getElementById('scene');
  const s=getEnvSize();
  const cardEl=document.createElement('div');
  cardEl.className='card-rising';
  cardEl.style.width=s.cardW+'px';
  cardEl.innerHTML=buildCard(s);
  scene.appendChild(cardEl);
  setTimeout(()=>{makeConfetti(60);},900);
}

function buildCard(s){
  const vw=window.innerWidth;
  const isSmall=vw<=480;
  const isLarge=vw>=1200;
  const cakeScale=isSmall?0.72:isLarge?1.18:1;
  const gap=isSmall?8:isLarge?18:13;
  const pad=isSmall?'18px 14px':isLarge?'36px 30px':'26px 22px';
  const titleSz=isSmall?'20px':isLarge?'32px':'26px';
  const subSz=isSmall?'12px':isLarge?'16px':'13.5px';
  const msgSz=isSmall?'11.5px':isLarge?'15px':'13px';
  const heartSz=isSmall?'15px':isLarge?'22px':'18px';
  const btnPad=isSmall?'10px 22px':isLarge?'14px 34px':'12px 28px';
  const btnSz=isSmall?'13px':isLarge?'16px':'14px';
  const mbottom=isSmall?'10px':'14px';

  return `<div class="card-inner" style="width:${s.cardW}px">
  <div class="bday-card" style="padding:${pad}">
    <div class="card-circles">
      <div class="card-circle" style="width:110px;height:110px;background:#ff9de2;top:-25px;left:-25px"></div>
      <div class="card-circle" style="width:80px;height:80px;background:#c084fc;bottom:20px;right:-15px"></div>
      <div class="card-circle" style="width:55px;height:55px;background:#fbbf24;bottom:-10px;left:50px"></div>
    </div>
    <div class="card-title" style="font-size:${titleSz};margin-bottom:4px;font-family:system-ui,sans-serif">Happy Birthday!</div>
    <div class="card-sub" style="font-size:${subSz};margin-bottom:${mbottom};font-family:system-ui,sans-serif">Wishing you the most magical day ✨</div>
    <div class="cakes-row" style="gap:${gap}px;margin-bottom:${mbottom}">
      <svg class="cake-svg" width="${Math.round(62*cakeScale)}" height="${Math.round(90*cakeScale)}" viewBox="0 0 62 90" fill="none">
        <rect x="8" y="52" width="46" height="32" rx="8" fill="#fc82bc"/><rect x="8" y="52" width="46" height="12" rx="5" fill="#ffaadb"/>
        <ellipse cx="31" cy="52" rx="23" ry="8" fill="#ffd0e8"/>
        <rect x="16" y="30" width="30" height="24" rx="6" fill="#f05aad"/>
        <ellipse cx="31" cy="30" rx="15" ry="6" fill="#ffc5e6"/>
        <circle cx="22" cy="66" r="3" fill="#fff" opacity="0.6"/><circle cx="40" cy="68" r="3" fill="#fff" opacity="0.55"/>
        <rect x="28" y="16" width="6" height="16" rx="3" fill="#ffeeaa"/>
        <g class="flame-g"><ellipse cx="31" cy="13" rx="3.5" ry="5" fill="#ffaa00" opacity="0.9"/><ellipse cx="31" cy="14" rx="2" ry="3.5" fill="#fff176"/></g>
      </svg>
      <svg class="cake-svg" width="${Math.round(90*cakeScale)}" height="${Math.round(120*cakeScale)}" viewBox="0 0 90 120" fill="none" style="animation-delay:0s">
        <rect x="8" y="72" width="74" height="42" rx="10" fill="#e84393"/>
        <rect x="8" y="72" width="74" height="16" rx="8" fill="#f06ab5"/>
        <ellipse cx="45" cy="72" rx="37" ry="11" fill="#ffd0e8"/>
        <ellipse cx="22" cy="76" rx="5" ry="8" fill="#ffd0e8" opacity="0.8"/><ellipse cx="45" cy="78" rx="5" ry="8" fill="#ffd0e8" opacity="0.8"/><ellipse cx="68" cy="76" rx="5" ry="8" fill="#ffd0e8" opacity="0.8"/>
        <rect x="18" y="42" width="54" height="34" rx="8" fill="#f05aad"/>
        <ellipse cx="45" cy="42" rx="27" ry="9" fill="#ffc5e6"/>
        <circle cx="30" cy="60" r="4" fill="#fff" opacity="0.55"/><circle cx="45" cy="64" r="3.5" fill="#fff" opacity="0.5"/><circle cx="60" cy="60" r="4" fill="#fff" opacity="0.55"/>
        <text x="24" y="100" font-size="11" fill="rgba(255,255,255,0.75)">&#10084;</text><text x="41" y="104" font-size="12" fill="rgba(255,255,255,0.8)">&#10084;</text><text x="58" y="100" font-size="11" fill="rgba(255,255,255,0.75)">&#10084;</text>
        <rect x="30" y="26" width="6" height="18" rx="3" fill="#b2f0e8"/><rect x="42" y="20" width="7" height="24" rx="3.5" fill="#ffc6e4"/><rect x="55" y="26" width="6" height="18" rx="3" fill="#fff176"/>
        <g class="flame-g" style="transform-origin:33px 22px"><ellipse cx="33" cy="22" rx="3.5" ry="5" fill="#ffaa00" opacity="0.9"/><ellipse cx="33" cy="23" rx="2" ry="3.5" fill="#fff176"/></g>
        <g class="flame-g" style="transform-origin:45px 15px;animation-delay:-0.2s"><ellipse cx="45" cy="15" rx="4" ry="6" fill="#ff6600" opacity="0.9"/><ellipse cx="45" cy="16" rx="2.5" ry="4" fill="#fff176"/></g>
        <g class="flame-g" style="transform-origin:58px 22px;animation-delay:-0.4s"><ellipse cx="58" cy="22" rx="3.5" ry="5" fill="#ffaa00" opacity="0.9"/><ellipse cx="58" cy="23" rx="2" ry="3.5" fill="#fff176"/></g>
      </svg>
      <svg class="cake-svg" width="${Math.round(58*cakeScale)}" height="${Math.round(86*cakeScale)}" viewBox="0 0 58 86" fill="none" style="animation-delay:-1.5s">
        <path d="M12 54 Q10 76 17 80 Q29 86 41 80 Q48 76 46 54Z" fill="#b97ecc"/>
        <ellipse cx="29" cy="38" rx="19" ry="16" fill="#ffc5e6"/>
        <path d="M29 22 Q40 26 40 38 Q38 50 29 52 Q20 50 18 38 Q18 26 29 22Z" fill="#ff9de2"/>
        <rect x="22" y="34" width="5" height="2.5" rx="1.25" fill="#e84393" transform="rotate(-20 22 34)"/>
        <rect x="32" y="30" width="5" height="2.5" rx="1.25" fill="#7c3aed" transform="rotate(15 32 30)"/>
        <rect x="23" y="42" width="4" height="2.5" rx="1.25" fill="#f59e0b" transform="rotate(40 23 42)"/>
        <rect x="34" y="41" width="5" height="2.5" rx="1.25" fill="#10b981" transform="rotate(-10 34 41)"/>
        <rect x="26" y="10" width="6" height="14" rx="3" fill="#ffd0e8"/>
        <g class="flame-g" style="transform-origin:29px 8px"><ellipse cx="29" cy="8" rx="3" ry="4.5" fill="#ffaa00" opacity="0.9"/><ellipse cx="29" cy="9" rx="2" ry="3" fill="#fff176"/></g>
      </svg>
    </div>
   <div class="msg-box" style="font-size:${msgSz};padding:${isSmall?'12px 13px':'16px 18px'};margin-bottom:${mbottom};font-family:system-ui,sans-serif">
      To my beautiful girl Happy Birthday bub 💕 they say age is just a number, but in your case, it just mean you get more irresistble every year. Here's to you — the most wonderful birthday girl! Cant't wait to eat you 🎉
    </div>
    <div class="hearts-row" style="font-size:${heartSz};gap:${isSmall?7:10}px;margin-bottom:${mbottom}">&#127775; &#128150; &#127874; &#128150; &#127775;</div>
    <button class="wish-btn" style="padding:${btnPad};font-size:${btnSz}" onclick="burst()">Send Birthday Wishes 🎊</button>
  </div>
</div>`;
}

function makeHeartFireworks(){
  const layer=document.getElementById('heartsLayer');
  const bursts=5;
  for(let b=0;b<bursts;b++){
    setTimeout(()=>{
      const cx=20+Math.random()*60;
      const cy=20+Math.random()*45;
      const count=14+Math.floor(Math.random()*6);
      for(let i=0;i<count;i++){
        const el=document.createElement('div');
        el.className='heart-piece';
        el.textContent='\uD83D\uDC9B';
        const angle=(Math.PI*2*i)/count+Math.random()*0.3;
        const dist=70+Math.random()*110;
        const hx=Math.cos(angle)*dist;
        const hy=Math.sin(angle)*dist;
        const sz=14+Math.random()*16;
        const dur=0.9+Math.random()*0.6;
        el.style.cssText=`left:${cx}%;top:${cy}%;font-size:${sz}px;--hx:${hx}px;--hy:${hy}px;--hs:${0.4+Math.random()*0.5};animation-duration:${dur}s;`;
        layer.appendChild(el);
        setTimeout(()=>el.remove(),dur*1000+100);
      }
    },b*180);
  }
}

function burst(){
  makeConfetti(80);
  makeHeartFireworks();
}

function replay(){
  phase=0;
  document.getElementById('confettiLayer').innerHTML='';
  document.getElementById('heartsLayer').innerHTML='';
  document.getElementById('hint').style.opacity='1';
  const rising=document.querySelector('.card-rising');
  if(rising)rising.remove();
  const wrap=document.getElementById('envWrap');
  wrap.classList.remove('slide-in','shake');
  wrap.style.transform='';
  wrap.style.opacity='';
  const lid=document.getElementById('lid');
  lid.classList.remove('opening');
  lid.style.animation='none';
  document.getElementById('seal').style.opacity='1';
  void wrap.offsetWidth;
  startSlide();
}

function startSlide(){
  applyEnvSize();
  const wrap=document.getElementById('envWrap');
  wrap.style.transform='translate(-50%,-50%) translateX(110vw) rotate(3deg)';
  wrap.style.opacity='0';
  void wrap.offsetWidth;
  setTimeout(()=>{
    wrap.classList.add('slide-in');
    setTimeout(()=>{
      wrap.classList.remove('slide-in');
      wrap.style.transform='translate(-50%,-50%)';
      wrap.style.opacity='1';
      void wrap.offsetWidth;
      wrap.classList.add('shake');
      setTimeout(()=>{
        wrap.classList.remove('shake');
        wrap.style.transform='translate(-50%,-50%)';
      },750);
    },1150);
  },60);
}

window.addEventListener('resize',()=>{
  if(phase===0) applyEnvSize();
});

makeBgStars();
startSlide();
</script>
</body>
